<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AI 그림 마법사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3a2e4a; --sub:#8a7a9b;
    --pink:#ff8fc0; --pinkD:#e85ba0;
    --blue:#7ea8ff; --blueD:#5d86e0;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Gaegu','Jua',sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#fff6e6 0%,#ffe9f3 50%,#e6f4ff 100%);
    overflow-x:hidden; -webkit-tap-highlight-color:transparent;
  }
  .blob{position:fixed;border-radius:50%;filter:blur(45px);opacity:.5;z-index:0;pointer-events:none;}
  .b1{width:340px;height:340px;background:#ffd6e7;top:-80px;left:-60px;animation:float 9s ease-in-out infinite;}
  .b2{width:300px;height:300px;background:#c5e8ff;bottom:-70px;right:-50px;animation:float 11s ease-in-out infinite;}
  .b3{width:260px;height:260px;background:#fff0c2;top:42%;left:55%;animation:float 13s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-28px)}}

  header{position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:16px 24px;}
  .logoBadge{font-size:30px;background:#fff;border-radius:18px;padding:6px 12px;box-shadow:0 6px 0 #ffd54f;}
  .logoTitle{font-size:26px;font-weight:800;letter-spacing:-.5px;}
  .logoSub{font-size:14px;color:var(--sub);}
  .homeBtn{margin-left:auto;border:none;background:#fff;border-radius:30px;padding:10px 18px;font:inherit;font-size:16px;cursor:pointer;box-shadow:0 4px 0 #d7c9e8;display:none;}

  main{position:relative;z-index:2;padding:6px 18px 60px;max-width:960px;margin:0 auto;}
  .screen{display:none;}
  .screen.on{display:block;}

  .fadeUp{animation:fadeUp .45s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  /* HOME */
  .center{text-align:center;}
  h1.homeH1{font-size:40px;font-weight:800;margin:14px 0 4px;}
  .homeP{font-size:20px;color:var(--sub);margin-bottom:32px;}
  .cardRow{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;}
  .bigCard{width:300px;border:none;cursor:pointer;border-radius:32px;padding:34px 24px;font:inherit;text-align:center;transition:transform .18s ease;color:#463a55;}
  .bigCard:active{transform:translateY(-2px);}
  .cardBlocks{background:linear-gradient(160deg,#ffe5b4,#ffd1a8);box-shadow:0 12px 0 #f0b878;}
  .cardChat{background:linear-gradient(160deg,#d6e4ff,#c4d3ff);box-shadow:0 12px 0 #9fb4f0;}
  .cardIcon{font-size:64px;}
  .cardTitle{font-size:28px;font-weight:800;margin:8px 0;}
  .cardDesc{font-size:17px;line-height:1.5;color:#5d5070;}
  .cardTag{display:inline-block;margin-top:16px;background:rgba(255,255,255,.7);border-radius:20px;padding:6px 16px;font-size:16px;font-weight:700;}

  /* BLOCKS */
  .progressRow{display:flex;gap:8px;justify-content:center;margin-bottom:6px;}
  .dot{width:14px;height:14px;border-radius:50%;background:#e7daf2;transition:all .3s;}
  .dot.active{background:var(--pink);transform:scale(1.35);}
  .dot.done{background:#b5e0a0;}
  .stepLabel{font-size:15px;color:#a394b3;margin-bottom:16px;text-align:center;}
  .questionCard{background:#fff;border-radius:30px;padding:30px 24px 34px;box-shadow:0 12px 0 rgba(170,140,200,.18);max-width:640px;margin:0 auto;text-align:center;}
  .qEmoji{font-size:52px;}
  .qTitle{font-size:30px;font-weight:800;margin:6px 0 22px;}
  .optGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
  .optBlock{border:none;background:linear-gradient(160deg,#fff,#fbf3ff);border-radius:22px;padding:22px 10px;font:inherit;font-size:21px;font-weight:700;cursor:pointer;color:#5b4a6e;box-shadow:0 6px 0 #e4d4f2;transition:transform .14s ease;}
  .optBlock:active{transform:translateY(-1px);box-shadow:0 4px 0 #d9c2ec;}
  .backBtn{margin:20px auto 0;display:block;border:none;background:transparent;font:inherit;font-size:17px;color:#a394b3;cursor:pointer;}

  /* REVIEW / RESULT */
  .reviewH2{font-size:32px;font-weight:800;margin-bottom:16px;text-align:center;}
  .artFrame{width:340px;height:340px;margin:0 auto;background:#fff;border-radius:26px;padding:14px;box-shadow:0 12px 0 rgba(170,140,200,.2);overflow:hidden;}
  .artFrame img{width:100%;height:100%;object-fit:contain;border-radius:14px;display:block;}
  .reviewP{font-size:19px;color:var(--sub);margin:22px 0 14px;text-align:center;}
  .tweakGrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px;margin:0 auto;}
  .tweakChip{border:3px solid #e9def5;background:#fff;border-radius:30px;padding:10px 18px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;color:#6b5a80;transition:all .15s;}
  .tweakChip.on{background:#ffe0ef;border-color:var(--pink);color:#d6488f;}
  .btnRow{display:flex;gap:14px;justify-content:center;margin-top:26px;flex-wrap:wrap;}
  .actionBtn{border:none;border-radius:30px;padding:16px 30px;font:inherit;font-size:20px;font-weight:800;cursor:pointer;transition:transform .15s ease;}
  .actionBtn:active{transform:translateY(0);}
  .actionBtn.primary{background:linear-gradient(160deg,#ff9ec8,#ff7eb5);color:#fff;box-shadow:0 7px 0 var(--pinkD);}
  .actionBtn.secondary{background:#fff;color:#7a6a8e;box-shadow:0 6px 0 #ddcfe9;}
  .errBox{background:#ffe2e2;color:#c0392b;padding:20px;border-radius:18px;max-width:380px;margin:0 auto;font-size:18px;text-align:center;}

  /* CHAT */
  .chatWrap{background:#fff;border-radius:28px;padding:18px;box-shadow:0 12px 0 rgba(170,140,200,.18);max-width:660px;margin:0 auto;}
  .chatHeader{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:3px dashed #f0e6f7;margin-bottom:12px;}
  .chatScroll{height:380px;overflow-y:auto;padding-right:6px;}
  .bubbleRow{display:flex;align-items:flex-end;gap:8px;margin-bottom:12px;}
  .avatar{font-size:26px;}
  .bubble{max-width:74%;padding:12px 16px;font-size:18px;line-height:1.45;white-space:pre-wrap;border-radius:20px;}
  .bubbleAI{background:#f3edff;border-bottom-left-radius:4px;}
  .bubbleUser{background:#ffe0ef;border-bottom-right-radius:4px;}
  .inputRow{display:flex;gap:8px;margin-top:8px;}
  .textInput{flex:1;border:3px solid #f0e6f7;border-radius:18px;padding:12px 16px;font:inherit;font-size:18px;outline:none;}
  .sendBtn{border:none;border-radius:18px;padding:0 22px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;background:linear-gradient(160deg,#a0c4ff,#7ea8ff);color:#fff;box-shadow:0 5px 0 var(--blueD);}
  .typing i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bfa9d6;margin:0 2px;animation:blink 1.2s infinite;}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* GENERATING */
  .genWrap{text-align:center;padding-top:50px;}
  .painter{font-size:80px;animation:wiggle 1s ease-in-out infinite;}
  @keyframes wiggle{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
  .genText{font-size:28px;font-weight:800;margin-top:10px;}
  .genSub{font-size:17px;color:var(--sub);margin-top:6px;}
  .genBar{width:240px;height:16px;background:#f0e6f7;border-radius:20px;margin:22px auto 0;overflow:hidden;}
  .genBar span{display:block;height:100%;width:40%;background:linear-gradient(90deg,#ff9ec8,#a0c4ff);border-radius:20px;animation:load 1.3s ease-in-out infinite;}
  @keyframes load{0%{margin-left:-40%}100%{margin-left:100%}}

  /* RESULT layout */
  .resultLayout{display:flex;gap:24px;justify-content:center;align-items:center;flex-wrap:wrap;}
  .qrCard{background:#fff;border-radius:26px;padding:22px;box-shadow:0 12px 0 rgba(170,140,200,.2);width:280px;text-align:center;}
  .qrTitle{font-size:22px;font-weight:800;margin-bottom:6px;}
  .qrDesc{font-size:15px;color:var(--sub);margin-bottom:14px;line-height:1.4;}
  .qrImg{width:220px;height:220px;object-fit:contain;margin:0 auto 12px;display:block;border-radius:12px;background:#faf6ff;}
  .qrWarn{background:#fff3e0;color:#c2630a;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;font-weight:700;}
</style>
</head>
<body>
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>

  <header>
    <span class="logoBadge">🤖🎨</span>
    <div>
      <div class="logoTitle">AI 그림 마법사</div>
      <div class="logoSub">나만의 그림을 만들어보자!</div>
    </div>
    <button class="homeBtn" id="homeBtn">🏠 처음으로</button>
  </header>

  <main>
    <!-- HOME -->
    <section class="screen on center" id="s-home">
      <h1 class="homeH1">어떻게 그림을 만들까?</h1>
      <p class="homeP">둘 중에 하나를 골라봐! 🎉</p>
      <div class="cardRow">
        <button class="bigCard cardBlocks" data-mode="blocks">
          <div class="cardIcon">🧩</div>
          <div class="cardTitle">블록으로 만들기</div>
          <div class="cardDesc">버튼을 톡톡 골라서<br>쉽고 빠르게 그림 완성!</div>
          <div class="cardTag">쉬워요 😊</div>
        </button>
        <button class="bigCard cardChat" data-mode="chat">
          <div class="cardIcon">💬</div>
          <div class="cardTitle">대화하며 만들기</div>
          <div class="cardDesc">AI 친구와 이야기하며<br>내 맘대로 그림 만들기!</div>
          <div class="cardTag">자유로워요 ✨</div>
        </button>
      </div>
    </section>

    <!-- BLOCKS -->
    <section class="screen" id="s-blocks">
      <div class="progressRow" id="progressRow"></div>
      <div class="stepLabel" id="stepLabel"></div>
      <div id="blockQuestion"></div>
    </section>

    <!-- CHAT -->
    <section class="screen" id="s-chat">
      <div class="chatWrap">
        <div class="chatHeader">🎨 그림 친구 아토와 대화하기</div>
        <div class="chatScroll" id="chatScroll"></div>
        <div class="inputRow">
          <input class="textInput" id="chatInput" placeholder="여기에 입력해봐...">
          <button class="sendBtn" id="chatSend">보내기</button>
        </div>
        <button class="actionBtn primary" id="chatFinish" style="margin-top:10px;width:100%">🎨 이제 그림 만들기!</button>
      </div>
    </section>

    <!-- GENERATING -->
    <section class="screen" id="s-gen">
      <div class="genWrap">
        <div class="painter">🎨</div>
        <div class="genText">그림을 그리는 중이에요...</div>
        <div class="genSub">AI 화가가 열심히 색칠하고 있어요! ✨</div>
        <div class="genBar"><span></span></div>
      </div>
    </section>

    <!-- REVIEW -->
    <section class="screen" id="s-review"></section>

    <!-- RESULT -->
    <section class="screen" id="s-result"></section>
  </main>

<script>
// ===================== 설정 =====================
// 같은 도메인에 배포되면 그대로 두면 됩니다.
// 프론트엔드와 API가 다른 주소면 여기에 백엔드 주소를 넣으세요. 예: "https://my-app.vercel.app"
const API_BASE = "";

// ===================== 데이터 =====================
const STEPS = [
  {key:"subject", title:"무엇을 그릴까?", emoji:"🎨", options:[
    ["귀여운 동물","귀엽고 사랑스러운 동물"],["멋진 로봇","반짝이는 멋진 로봇"],
    ["우주 행성","신비로운 우주의 행성"],["마법의 성","동화 속 마법의 성"],
    ["바다 생물","바닷속 신기한 생물"],["공룡","씩씩한 공룡"]]},
  {key:"place", title:"어디에 있을까?", emoji:"🌍", options:[
    ["숲속","푸른 숲속"],["우주","별이 가득한 우주"],["바닷가","햇살 비치는 바닷가"],
    ["미래 도시","반짝이는 미래 도시"],["하늘 위","구름 위 하늘"],["동굴 속","보석이 빛나는 동굴 속"]]},
  {key:"color", title:"어떤 색이 좋아?", emoji:"🌈", options:[
    ["무지개색","알록달록 무지개색"],["파란색","시원한 파란색 위주"],["분홍색","사랑스러운 분홍색 위주"],
    ["초록색","싱그러운 초록색 위주"],["노란색","밝고 따뜻한 노란색 위주"],["보라색","신비로운 보라색 위주"]]},
  {key:"mood", title:"기분은 어때?", emoji:"✨", options:[
    ["신나는","신나고 활기찬 분위기"],["평화로운","평화롭고 잔잔한 분위기"],["신비로운","신비롭고 마법같은 분위기"],
    ["씩씩한","씩씩하고 용감한 분위기"],["포근한","포근하고 따뜻한 분위기"]]},
  {key:"style", title:"그림 스타일은?", emoji:"🖌️", options:[
    ["동화 그림","부드러운 동화책 일러스트 스타일"],["만화","귀여운 만화 스타일"],["수채화","맑은 수채화 스타일"],
    ["픽셀아트","도트가 보이는 픽셀아트 스타일"],["사실적","실제 사진처럼 사실적인 스타일"]]},
  {key:"time", title:"언제일까?", emoji:"🕐", options:[
    ["한낮","밝은 한낮"],["노을","주황빛 노을 질 때"],["밤","별빛 가득한 밤"],["새벽","안개 낀 새벽"]]},
];
const TWEAKS = [
  ["더 밝게","전체적으로 더 밝고 화사하게"],["더 크게","주인공을 더 크고 가깝게"],
  ["친구 추가","옆에 귀여운 친구를 한 명 더 추가"],["반짝이 추가","반짝이는 빛 효과를 잔뜩 추가"],
  ["더 단순하게","배경을 단순하게 정리"],["더 화려하게","더 화려하고 디테일을 풍부하게"]];

// ===================== 상태 =====================
let picks = {};
let stepIdx = 0;
let selectedTweaks = [];
let lastPrompt = "";
let chatMessages = [];

// ===================== 화면 전환 =====================
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.getElementById('homeBtn').style.display = (id==='s-home') ? 'none' : 'block';
  window.scrollTo(0,0);
}
function goHome(){
  picks={}; stepIdx=0; selectedTweaks=[]; chatMessages=[]; show('s-home');
}
document.getElementById('homeBtn').onclick = goHome;

// ===================== 모드 선택 =====================
document.querySelectorAll('.bigCard').forEach(b=>{
  b.onclick = ()=>{
    if(b.dataset.mode==='blocks'){ picks={}; stepIdx=0; renderBlockStep(); show('s-blocks'); }
    else { startChat(); show('s-chat'); }
  };
});

// ===================== API 호출 =====================
async function apiGenerate(prompt){
  const r = await fetch(API_BASE + "/api/generate", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ prompt })
  });
  if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.error||"생성 실패"); }
  return (await r.json()).url;
}
async function apiChat(messages){
  const r = await fetch(API_BASE + "/api/chat", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ messages })
  });
  if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.error||"대화 실패"); }
  return (await r.json()).reply;
}

// ===================== 블록 플로우 =====================
function renderProgress(){
  const row = document.getElementById('progressRow'); row.innerHTML='';
  STEPS.forEach((s,i)=>{
    const d=document.createElement('span');
    d.className='dot'+(i===stepIdx?' active':i<stepIdx?' done':'');
    row.appendChild(d);
  });
  document.getElementById('stepLabel').textContent = (stepIdx+1)+" / "+STEPS.length;
}
function renderBlockStep(){
  renderProgress();
  const step = STEPS[stepIdx];
  const wrap = document.getElementById('blockQuestion');
  wrap.innerHTML = '';
  const card = document.createElement('div');
  card.className='questionCard fadeUp';
  card.innerHTML = '<div class="qEmoji">'+step.emoji+'</div><h2 class="qTitle">'+step.title+'</h2>';
  const grid = document.createElement('div'); grid.className='optGrid';
  step.options.forEach(([label,value])=>{
    const btn=document.createElement('button'); btn.className='optBlock'; btn.textContent=label;
    btn.onclick=()=>{
      picks[step.key]=value;
      if(stepIdx<STEPS.length-1){ stepIdx++; renderBlockStep(); }
      else { runGenerate(buildPrompt()); }
    };
    grid.appendChild(btn);
  });
  card.appendChild(grid);
  wrap.appendChild(card);
  if(stepIdx>0){
    const back=document.createElement('button'); back.className='backBtn'; back.textContent='← 뒤로';
    back.onclick=()=>{ stepIdx--; renderBlockStep(); };
    wrap.appendChild(back);
  }
}
function buildPrompt(extra){
  const base = STEPS.map(s=>picks[s.key]).filter(Boolean).join(", ");
  const ex = (extra&&extra.length) ? " 추가 요청: "+extra.join(", ")+"." : "";
  return base+"."+ex;
}

// ===================== 생성 + 리뷰 =====================
async function runGenerate(prompt){
  lastPrompt = prompt;
  show('s-gen');
  try{
    const url = await apiGenerate(prompt);
    renderReview(url, null);
  }catch(e){
    renderReview(null, e.message);
  }
}
let currentImageUrl = null;
function renderReview(url, err){
  currentImageUrl = url;
  const s = document.getElementById('s-review');
  let html = '<div class="fadeUp center"><h2 class="reviewH2">그림이 완성됐어! 🎉</h2>';
  if(err){ html += '<div class="errBox">앗, 그림 만들기에 실패했어요.<br>'+err+'<br>다시 해볼까요?</div>'; }
  else { html += '<div class="artFrame"><img src="'+url+'" alt="내 그림"></div>'; }
  html += '<p class="reviewP">마음에 들어? 아니면 조금 바꿔볼까?</p><div class="tweakGrid" id="tweakGrid"></div>';
  html += '<div class="btnRow" id="reviewBtns"></div></div>';
  s.innerHTML = html;

  const grid = document.getElementById('tweakGrid');
  selectedTweaks = [];
  TWEAKS.forEach(([label,value])=>{
    const c=document.createElement('button'); c.className='tweakChip'; c.textContent='+ '+label;
    c.onclick=()=>{
      const i=selectedTweaks.indexOf(value);
      if(i>=0){ selectedTweaks.splice(i,1); c.classList.remove('on'); c.textContent='+ '+label; }
      else { selectedTweaks.push(value); c.classList.add('on'); c.textContent='✓ '+label; }
      renderReviewButtons();
    };
    grid.appendChild(c);
  });
  renderReviewButtons();
  show('s-review');
}
function renderReviewButtons(){
  const row = document.getElementById('reviewBtns'); if(!row) return;
  row.innerHTML='';
  if(selectedTweaks.length>0){
    const fix=document.createElement('button'); fix.className='actionBtn secondary';
    fix.textContent='🔄 이렇게 고치기 ('+selectedTweaks.length+')';
    fix.onclick=()=> runGenerate(buildPrompt(selectedTweaks.slice()));
    row.appendChild(fix);
  }
  if(currentImageUrl){
    const done=document.createElement('button'); done.className='actionBtn primary';
    done.textContent='✅ 완성! 공유하기';
    done.onclick=()=> renderResult(currentImageUrl);
    row.appendChild(done);
  } else {
    const retry=document.createElement('button'); retry.className='actionBtn primary';
    retry.textContent='🔄 다시 만들기';
    retry.onclick=()=> runGenerate(lastPrompt);
    row.appendChild(retry);
  }
}

// ===================== 결과 + QR =====================
function renderResult(url){
  const qr = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&data="+encodeURIComponent(url);
  const s = document.getElementById('s-result');
  s.innerHTML =
    '<div class="fadeUp center"><h2 class="reviewH2">🎉 완성! 멋진 작품이야! 🎉</h2>'+
    '<div class="resultLayout">'+
      '<div class="artFrame"><img src="'+url+'" alt="내 그림"></div>'+
      '<div class="qrCard"><div class="qrTitle">📱 QR로 가져가기</div>'+
      '<div class="qrDesc">휴대폰 카메라로 QR을 찍으면<br>내 그림을 볼 수 있어요!</div>'+
      '<img class="qrImg" src="'+qr+'" alt="QR 코드">'+
      '<div class="qrWarn">⏰ 이 QR은 <b>5시간 후에 사라져요.</b><br>그 전에 꼭 휴대폰에 저장해 주세요!</div></div>'+
    '</div>'+
    '<div class="btnRow"><button class="actionBtn primary" id="againBtn">🆕 새 그림 만들기</button></div></div>';
  show('s-result');
  document.getElementById('againBtn').onclick = goHome;
}

// ===================== 채팅 플로우 =====================
const CHAT_GREETING = "안녕! 나는 그림 친구 아토야 🎨\n오늘 어떤 그림을 만들고 싶어? 동물, 로봇, 우주... 뭐든 좋아! 떠오르는 걸 말해줘 😊";
function startChat(){
  chatMessages = [{role:"assistant", content:CHAT_GREETING}];
  renderChat();
}
function renderChat(loading){
  const sc = document.getElementById('chatScroll'); sc.innerHTML='';
  chatMessages.forEach(m=>{
    const row=document.createElement('div'); row.className='bubbleRow fadeUp';
    row.style.justifyContent = m.role==='user' ? 'flex-end' : 'flex-start';
    if(m.role==='assistant'){ const a=document.createElement('span'); a.className='avatar'; a.textContent='🤖'; row.appendChild(a); }
    const b=document.createElement('div'); b.className='bubble '+(m.role==='user'?'bubbleUser':'bubbleAI');
    b.textContent=m.content; row.appendChild(b);
    sc.appendChild(row);
  });
  if(loading){
    const row=document.createElement('div'); row.className='bubbleRow';
    row.innerHTML='<span class="avatar">🤖</span><div class="bubble bubbleAI"><span class="typing"><i></i> <i></i> <i></i></span></div>';
    sc.appendChild(row);
  }
  sc.scrollTo({top:sc.scrollHeight, behavior:'smooth'});
}
async function sendChat(){
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim(); if(!text) return;
  inp.value='';
  chatMessages.push({role:'user', content:text});
  renderChat(true);
  try{
    const reply = await apiChat(chatMessages.filter(m=>m.role!=='system'));
    chatMessages.push({role:'assistant', content:reply});
  }catch(e){
    chatMessages.push({role:'assistant', content:"앗, 잠깐 문제가 생겼어. 다시 한 번 말해줄래? 🙏"});
  }
  renderChat(false);
}
document.getElementById('chatSend').onclick = sendChat;
document.getElementById('chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendChat(); });
document.getElementById('chatFinish').onclick = async ()=>{
  // 1) 아토가 마무리 인사 (프롬프트는 절대 보여주지 않음)
  chatMessages.push({ role:'assistant', content:"알겠어! 이제 그림을 그려줄게! 🎨" });
  renderChat(false);
  await new Promise(r => setTimeout(r, 900)); // 인사를 잠깐 보여준 뒤
  show('s-gen');
  try{
    // 2) 대화를 화면 뒤에서 조용히 그림 설명으로 정리 (사용자에게 안 보임)
    const summaryMsgs = chatMessages.filter(m=>m.role!=='system').concat([
      {role:'user', content:"지금까지 이야기한 내용을 바탕으로, 만들 그림을 영어로 한 문단 자세히 묘사해줘. 설명 문장만 출력하고 다른 말은 절대 하지 마."}
    ]);
    const desc = await apiChat(summaryMsgs);
    const url = await apiGenerate(desc);
    // 3) 곧바로 완성(QR) 화면으로
    renderResult(url);
  }catch(e){
    chatMessages.push({ role:'assistant', content:"앗, 그림 만들기에 실패했어 ㅠㅠ 잠시 뒤에 버튼을 한 번 더 눌러줄래?" });
    show('s-chat');
    renderChat(false);
  }
};
</script>
