<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AI 그림 마법사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="css/styles.css?v=8" />
</head>
<body>
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>

  <header>
    <img class="logoBadge" src="assets/seoulraim_logo.png" alt="SEOUL RAIM" />
    <div>
      <div class="logoTitle" data-i18n="appTitle">AI 그림 연구소</div>
      <div class="logoSub" data-i18n="appSub">나만의 그림을 만들어보자!</div>
    </div>
    <div class="headRight">
      <button class="homeBtn" id="homeBtn" data-i18n="homeBtn">🏠 처음으로</button>
      <div class="langWrap">
        <button class="langBtn" id="langBtn"><span class="globe">🌐</span><span id="langCurrent">LANG</span></button>
        <div class="langMenu" id="langMenu"></div>
      </div>
    </div>
  </header>

  <main>
    <!-- INTRO -->
    <section class="screen on" id="s-intro">
      <div class="introWrap fadeUp">
        <img class="introHero" id="introHero" src="assets/raimi.png" alt="라이미" />
        <div class="introHi" data-i18n="introHi">안녕! 나는 그림 친구 라이미야 🤖🎨</div>
        <h1 class="introTitle" data-i18n="introTitle">라이미와 함께 그림을 만들어보자!</h1>
        <div class="introBubble" data-i18n-html="introBody"></div>
        <button class="introBtn" id="introStart" data-i18n="introStart">좋아, 시작하자! 🚀</button>
      </div>
    </section>

    <!-- HOME -->
    <section class="screen center" id="s-home">
      <h1 class="homeH1" data-i18n="homeH1">어떻게 그림을 만들까?</h1>
      <p class="homeP" data-i18n="homeP">둘 중에 하나를 골라봐! 🎉</p>
      <div class="cardRow">
        <button class="bigCard cardBlocks" data-mode="blocks">
          <div class="cardIcon">🧩</div>
          <div class="cardTitle" data-i18n="cardBlocksTitle">블록으로 만들기</div>
          <div class="cardDesc" data-i18n-html="cardBlocksDesc"></div>
          <div class="cardTag" data-i18n="cardBlocksTag">쉬워요 😊</div>
        </button>
        <button class="bigCard cardChat" data-mode="chat">
          <img class="cardImg" id="cardChatImg" src="assets/raimi.png" alt="라이미" />
          <div class="cardTitle" data-i18n="cardChatTitle">대화하며 만들기</div>
          <div class="cardDesc" data-i18n-html="cardChatDesc"></div>
          <div class="cardTag" data-i18n="cardChatTag">자유로워요 ✨</div>
        </button>
      </div>
    </section>

    <!-- BLOCKS -->
    <section class="screen" id="s-blocks">
      <div class="progressRow" id="progressRow"></div>
      <div class="stepLabel" id="stepLabel"></div>
      <div id="blockQuestion"></div>
    </section>

    <!-- CHAT -->
    <section class="screen" id="s-chat">
      <div class="chatWrap">
        <div class="chatHeader" data-i18n="chatHeader">🎨 그림 친구 라이미와 대화하기</div>
        <div class="chatScroll" id="chatScroll"></div>
        <div class="inputRow">
          <input class="textInput" id="chatInput" data-i18n-ph="chatPlaceholder" placeholder="여기에 입력해봐...">
          <button class="sendBtn" id="chatSend" data-i18n="chatSend">보내기</button>
        </div>
        <button class="actionBtn primary" id="chatFinish" data-i18n="chatFinish">🎨 이제 그림 만들기!</button>
      </div>
    </section>

    <!-- GENERATING -->
    <section class="screen" id="s-gen">
      <div class="genWrap">
        <img class="painter" id="genPainter" src="assets/raimi_drawing_1.png" alt="라이미" />
        <div class="genText" data-i18n="genText">그림을 그리는 중이에요...</div>
        <div class="genSub" data-i18n="genSub">라이미가 열심히 색칠하고 있어요! ✨</div>
        <div class="genBar"><span></span></div>
        <div class="quizCard" id="quizCard"></div>
      </div>
    </section>

    <!-- REVIEW -->
    <section class="screen" id="s-review"></section>

    <!-- RESULT -->
    <section class="screen" id="s-result"></section>
  </main>

  <footer class="siteFooter">Created by Juwon Lee · Seoul RAIM</footer>

  <script type="module" src="js/app.js?v=7"></script>
</body>
</html>
