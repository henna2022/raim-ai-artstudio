<svg xmlns="http://www.w3.org/2000/svg" width="680" height="690" viewBox="0 0 680 690" role="img" font-family="-apple-system, 'Apple SD Gothic Neo', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans KR', sans-serif">
<title>Raimi's AI Art Studio screen flow</title>
<desc>Screen flow: intro to home mode picker, blocks/chat creation, generating, result with QR. Includes review on failure, global reset, admin stats entry.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path stroke="#7FA9D8" d="M2 1L8 5L2 9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowret" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path stroke="#A8C6E8" d="M2 1L8 5L2 9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<filter id="shLight" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#1B4B8A" flood-opacity="0.12"/></filter>
<filter id="shDark" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.38"/></filter>
</defs>
<style>
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.hd1{font-size:16px;font-weight:500}
.hd2{font-size:12px;font-weight:400;letter-spacing:.06em}
.lbl{font-size:12px;font-weight:400}
.bn{font-size:12px;font-weight:500}
.card{stroke-width:1}.mode{stroke-width:1}.prim{stroke-width:1}.slate{stroke-width:1}
.admin{stroke-width:1.2;stroke-dasharray:5 4}
.note{stroke-width:1;stroke-dasharray:5 4}
.arr{stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ret{stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 4}
.badge{stroke-width:1.5}
.bg{fill:#F5F9FE}
.hd1{fill:#16365C}
.hd2{fill:#5B7591}
.n-t{fill:#16365C}
.n-s{fill:#5B7591}
.b-t{fill:#1B4B8A}
.b-s{fill:#3E6BA0}
.p-t{fill:#FFFFFF}
.p-s{fill:#DCEBFB}
.s-t{fill:#46617F}
.s-s{fill:#6B819B}
.card{fill:#FFFFFF;stroke:#D3E2F1}
.mode{fill:#EAF3FC;stroke:#B7D4F1}
.prim{fill:#3B7DD8;stroke:#2E6BC4}
.slate{fill:#EDF1F6;stroke:#CAD6E4}
.admin{fill:#FFFFFF;stroke:#B7D4F1}
.note{fill:#F0F6FD;stroke:#C6DCF3}
.arr{stroke:#7FA9D8}
.ret{stroke:#A8C6E8}
.lbl{fill:#5B7591}
.badge{fill:#FFFFFF;stroke:#3B7DD8}
.bn{fill:#1B4B8A}
.ahd{stroke:#7FA9D8}
.ahdr{stroke:#A8C6E8}
.sh{filter:url(#shLight)}
</style>
<rect x="0" y="0" width="680" height="690" fill="#F5F9FE"/>
<text class="hd1" x="340" y="28" text-anchor="middle">Raimi's AI Art Studio</text>
<text class="hd2" x="340" y="46" text-anchor="middle">app screen flow</text>
<line class="arr" x1="300" y1="90" x2="300" y2="108" marker-end="url(#arrow)"/>
<path class="arr" d="M385,73 L545,73 L545,108" marker-end="url(#arrow)"/>
<text class="lbl" x="465" y="66" text-anchor="middle">?admin</text>
<line class="arr" x1="300" y1="164" x2="300" y2="202" marker-end="url(#arrow)"/>
<path class="arr" d="M300,258 L300,276 L155,276 L155,296" marker-end="url(#arrow)"/>
<path class="arr" d="M300,276 L445,276 L445,296" marker-end="url(#arrow)"/>
<path class="arr" d="M155,352 L155,372 L290,372 L290,392" marker-end="url(#arrow)"/>
<path class="arr" d="M445,352 L445,372 L310,372 L310,392" marker-end="url(#arrow)"/>
<line class="arr" x1="300" y1="448" x2="300" y2="488" marker-end="url(#arrow)"/>
<text class="lbl" x="314" y="472" text-anchor="start">success</text>
<line class="arr" x1="400" y1="412" x2="455" y2="412" marker-end="url(#arrow)"/>
<text class="lbl" x="427" y="405" text-anchor="middle">fail</text>
<line class="arr" x1="455" y1="432" x2="400" y2="432" marker-end="url(#arrow)"/>
<text class="lbl" x="427" y="447" text-anchor="middle">retry</text>
<path class="ret" d="M200,516 L30,516 L30,230 L200,230" marker-end="url(#arrowret)"/>
<text class="lbl" x="112" y="508" text-anchor="middle">make again</text>
<rect class="prim" x="215" y="56" width="170" height="34" rx="17" filter="url(#shLight)"/>
<text class="th p-t" x="300" y="73" text-anchor="middle" dominant-baseline="central">App launch (URL load)</text>
<rect class="card" x="200" y="108" width="200" height="56" rx="10" filter="url(#shLight)"/>
<text class="th n-t" x="300" y="129" text-anchor="middle" dominant-baseline="central">Intro</text>
<text class="ts n-s" x="300" y="147" text-anchor="middle" dominant-baseline="central">Meet Raimi · start</text>
<rect class="admin" x="455" y="108" width="180" height="56" rx="10"/>
<text class="th n-t" x="545" y="129" text-anchor="middle" dominant-baseline="central">Admin stats</text>
<text class="ts n-s" x="545" y="147" text-anchor="middle" dominant-baseline="central">Usage stats · export</text>
<rect class="card" x="200" y="202" width="200" height="56" rx="10" filter="url(#shLight)"/>
<text class="th n-t" x="300" y="223" text-anchor="middle" dominant-baseline="central">Home · pick mode</text>
<text class="ts n-s" x="300" y="241" text-anchor="middle" dominant-baseline="central">Blocks or Chat</text>
<rect class="mode" x="55" y="296" width="200" height="56" rx="10" filter="url(#shLight)"/>
<text class="th b-t" x="155" y="317" text-anchor="middle" dominant-baseline="central">Build with blocks</text>
<text class="ts b-s" x="155" y="335" text-anchor="middle" dominant-baseline="central">10–15 guided steps</text>
<rect class="mode" x="345" y="296" width="200" height="56" rx="10" filter="url(#shLight)"/>
<text class="th b-t" x="445" y="317" text-anchor="middle" dominant-baseline="central">Build by chatting</text>
<text class="ts b-s" x="445" y="335" text-anchor="middle" dominant-baseline="central">with Raimi · up to 8 turns</text>
<rect class="card" x="200" y="392" width="200" height="56" rx="10" filter="url(#shLight)"/>
<text class="th n-t" x="300" y="413" text-anchor="middle" dominant-baseline="central">Generating art</text>
<text class="ts n-s" x="300" y="431" text-anchor="middle" dominant-baseline="central">Drawing + O/X quiz</text>
<rect class="slate" x="455" y="392" width="180" height="56" rx="10" filter="url(#shLight)"/>
<text class="th s-t" x="545" y="413" text-anchor="middle" dominant-baseline="central">Review</text>
<text class="ts s-s" x="545" y="431" text-anchor="middle" dominant-baseline="central">On failure · retry</text>
<rect class="prim" x="200" y="488" width="200" height="56" rx="10" filter="url(#shLight)"/>
<text class="th p-t" x="300" y="509" text-anchor="middle" dominant-baseline="central">Result</text>
<text class="ts p-s" x="300" y="527" text-anchor="middle" dominant-baseline="central">Image + QR code</text>
<circle class="badge" cx="200" cy="108" r="11"/><text class="bn" x="200" y="108" text-anchor="middle" dominant-baseline="central">1</text>
<circle class="badge" cx="200" cy="202" r="11"/><text class="bn" x="200" y="202" text-anchor="middle" dominant-baseline="central">2</text>
<circle class="badge" cx="55" cy="296" r="11"/><text class="bn" x="55" y="296" text-anchor="middle" dominant-baseline="central">3</text>
<circle class="badge" cx="345" cy="296" r="11"/><text class="bn" x="345" y="296" text-anchor="middle" dominant-baseline="central">3</text>
<circle class="badge" cx="200" cy="392" r="11"/><text class="bn" x="200" y="392" text-anchor="middle" dominant-baseline="central">4</text>
<circle class="badge" cx="200" cy="488" r="11"/><text class="bn" x="200" y="488" text-anchor="middle" dominant-baseline="central">5</text>
<rect class="note" x="55" y="580" width="580" height="64" rx="10"/>
<text class="th n-t" x="345" y="598" text-anchor="middle" dominant-baseline="central">Global behavior</text>
<text class="ts n-s" x="345" y="616" text-anchor="middle" dominant-baseline="central">‘Home’ button · 3-min idle → reset to intro (confirm if in progress)</text>
<text class="ts n-s" x="345" y="634" text-anchor="middle" dominant-baseline="central">KO/EN toggle · admin stats open via ?admin</text>
<rect class="card" x="116" y="658" width="14" height="14" rx="3"/><text class="ts n-s" x="136" y="665" text-anchor="start" dominant-baseline="central">Screen</text>
<rect class="mode" x="228" y="658" width="14" height="14" rx="3"/><text class="ts n-s" x="248" y="665" text-anchor="start" dominant-baseline="central">Create mode</text>
<rect class="prim" x="340" y="658" width="14" height="14" rx="3"/><text class="ts n-s" x="360" y="665" text-anchor="start" dominant-baseline="central">Start · finish</text>
<rect class="slate" x="452" y="658" width="14" height="14" rx="3"/><text class="ts n-s" x="472" y="665" text-anchor="start" dominant-baseline="central">Error path</text>
</svg>
